name: WarLegend RaidTool checks

# On every push, pull request and tag (or by hand): the checks of the PC (tools/check.js) plus Luacheck, the API used
# against Blizzard's documentation of the current Forever build, and the smoke test in a simulated client.
# A failure puts a red cross on the commit and GitHub e-mails the person who pushed. It never changes the code.
# A tag runs it from wlrt-release.yml (workflow_call): the release is published only when every check passed.

on:
  push:
    branches: ["**"] # tags: run by wlrt-release.yml before the zip
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a full commit SHA (a tag can be moved); the comment says which release it is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tools (luaparse, fengari)
        run: npm ci --prefix tools --no-audit --no-fund

      - name: check.js (Lua 5.1 syntax, BOM / CRLF, .toc, globals, /wl vs HELP / README, prefixes, French texts)
        run: node tools/check.js

      - name: Luacheck 1.2.0 (signed release binary, SHA-256 pinned)
        run: |
          curl -sSfL --max-time 60 -o "$RUNNER_TEMP/luacheck" https://github.com/lunarmodules/luacheck/releases/download/v1.2.0/luacheck
          echo "d68da17fca0697d9e2fb04201f3884abd259fa558b3a449bccaed47f1390defc  $RUNNER_TEMP/luacheck" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/luacheck"
          "$RUNNER_TEMP/luacheck" --config tools/.luacheckrc --codes --formatter plain \
            WarLegendRaidTool WarLegendRaidTool_Raid WarLegendRaidTool_PvP WarLegendRaidTool_Skyborne WarLegendRaidTool_Myslot WarLegendRaidTool_DoesItDie

      - name: API used vs Blizzard's documentation (Gethe/wow-ui-source, branch forever)
        run: node tools/wow-api.js check

      - name: Smoke test (simulated client, two runs)
        run: node tools/smoke.js

  # The two other smoke tests are independent of the job above: apart, they run at the same time (about 30 s less).
  smoke-open-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tools (luaparse, fengari)
        run: npm ci --prefix tools --no-audit --no-fund

      - name: Smoke test, open world (raid of 40, guild of 120, about 20 s)
        run: node tools/smoke.js --open-world

  smoke-bg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tools (luaparse, fengari)
        run: npm ci --prefix tools --no-audit --no-fund

      - name: Smoke test, battleground (Alterac 40 vs 40, cost per frame, about 20 s)
        run: node tools/smoke.js --bg
