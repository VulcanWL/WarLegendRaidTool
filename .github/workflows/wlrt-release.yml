name: WarLegend RaidTool release

# Push a tag like v1.24.1 -> GitHub builds WarLegendRaidTool-1.24.1-forever.zip with the four addon folders
# (WarLegendRaidTool, WarLegendRaidTool_Raid, WarLegendRaidTool_PvP, WarLegendRaidTool_Skyborne; Myslot and DoesItDie are inside WarLegendRaidTool) and publishes it as a Release.
# The guild downloads that zip, and WowUp reads the Releases to offer the update.
# WowUp (github-addon-provider.ts): the _classic_beta_ client is "ClassicBeta" = flavor "forever". It takes the
# asset named in release.json for that flavor, or else a zip whose name ends in "-forever.zip". The zip name is
# the version WowUp compares, so it changes with every release.
# The release notes are the "## <version>" section of CHANGELOG.md, above GitHub's compare link.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # every check of wlrt-ci.yml first: a red check means no release
  checks:
    uses: ./.github/workflows/wlrt-ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a full commit SHA (a tag can be moved); the comment says which release it is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches the .toc versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for toc in WarLegendRaidTool/WarLegendRaidTool.toc WarLegendRaidTool_Raid/WarLegendRaidTool_Raid.toc WarLegendRaidTool_PvP/WarLegendRaidTool_PvP.toc WarLegendRaidTool_Skyborne/WarLegendRaidTool_Skyborne.toc; do
            VERSION="$(grep -m1 '^## Version:' "$toc" | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')"
            if [ "$VERSION" != "$TAG" ]; then
              echo "::error::$toc says $VERSION, the tag says $TAG"
              exit 1
            fi
          done

      - name: Build the zip and release.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="WarLegendRaidTool-${VERSION}-forever.zip"
          zip -r -q "$ZIP" WarLegendRaidTool WarLegendRaidTool_Raid WarLegendRaidTool_PvP WarLegendRaidTool_Skyborne \
            -x "*/AGENTS.md" "*/STATUS.md" "*/.git*" "*/Libs/LibStub/tests/*"
          # WarLegendRaidTool_Dev (/wl verify) is for internal testing only: never shipped to the players
          if unzip -Z1 "$ZIP" | grep -q '^WarLegendRaidTool_Dev/'; then echo "WarLegendRaidTool_Dev must not be in the zip"; exit 1; fi
          INTERFACE="$(grep -m1 '^## Interface:' WarLegendRaidTool/WarLegendRaidTool.toc | sed 's/^## Interface:[[:space:]]*//' | tr -d '\r')"
          cat > release.json <<EOF
          {"releases":[{"name":"WarLegendRaidTool","version":"${VERSION}","filename":"${ZIP}","nolib":false,"metadata":[{"flavor":"forever","interface":${INTERFACE}}]}]}
          EOF
          cat release.json
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Notes for the players: the lines under "## <version>" up to the next "## " (check.js refuses a .toc version
      # without that section, so this only fails if the check was skipped)
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > notes.md
          if ! grep -q '^- ' notes.md; then echo "::error::CHANGELOG.md has no notes under ## $VERSION"; exit 1; fi
          cat notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: WarLegend RaidTool ${{ env.VERSION }}
          body_path: notes.md
          files: |
            ${{ env.ZIP }}
            release.json
          generate_release_notes: true
